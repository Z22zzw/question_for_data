<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>问卷管理后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; }
    .topbar { background: #1a1a2e; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    .topbar h1 { font-size: 18px; font-weight: 600; }
    .topbar .spacer { flex: 1; }
    #loginPanel { max-width: 360px; margin: 80px auto; background: #fff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    #loginPanel h2 { margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 13px; color: #555; }
    .field input, .field select, .field textarea { padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .field textarea { min-height: 72px; resize: vertical; font-family: inherit; }
    .filter-field { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
    .filter-field select { padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; background: #fff; font-size: 13px; }
    .version-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; }
    .version-controls strong { margin-right: 2px; }
    .version-controls label { display: flex; align-items: center; gap: 4px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn-primary { background: #1a1a2e; color: #fff; }
    .btn-primary:hover { background: #2d2d5e; }
    .btn-danger { background: #dc3545; color: #fff; }
    .btn-danger:hover { background: #b02a37; }
    .btn-secondary { background: #e9ecef; color: #333; }
    .btn-secondary:hover { background: #dee2e6; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    #mainPanel { display: none; padding: 24px; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar .stats { font-size: 13px; color: #666; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); font-size: 13px; }
    th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-weight: 600; border-bottom: 2px solid #dee2e6; white-space: nowrap; }
    td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8f9fa; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-complete { background: #d1fae5; color: #065f46; }
    .badge-progress { background: #dbeafe; color: #1e40af; }
    .badge-abandoned { background: #fee2e2; color: #991b1b; }
    .badge-timeout { background: #ffe4e6; color: #9f1239; }
    .badge-invalid { background: #fef3c7; color: #92400e; }
    .badge-manual { background: #e0f2fe; color: #075985; }
    .badge-test { background: #edeff3; color: #374151; }
    .badge-a { background: #ede9fe; color: #5b21b6; }
    .badge-b { background: #fce7f3; color: #9d174d; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; overflow-y: auto; padding: 40px 16px; }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal { background: #fff; border-radius: 10px; width: 100%; max-width: 720px; padding: 28px; }
    .modal h2 { margin-bottom: 20px; font-size: 17px; }
    .modal-close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #888; }
    .section-title { font-size: 13px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: .5px; margin: 20px 0 10px; }
    .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
    .kv { background: #f8f9fa; border-radius: 6px; padding: 8px 12px; }
    .kv .k { font-size: 11px; color: #888; margin-bottom: 2px; }
    .kv .v { font-size: 13px; font-weight: 500; }
    .answers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
    .answer-cell { background: #f8f9fa; border-radius: 4px; padding: 6px 8px; font-size: 12px; }
    .answer-cell .qid { color: #888; font-size: 10px; }
    .answer-cell.correct { background: #d1fae5; }
    .answer-cell.wrong { background: #fee2e2; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
    .edit-row { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
    .error { color: #dc3545; font-size: 13px; margin-top: 8px; }
    .flag-list { font-size: 12px; color: #92400e; }
    .review-panel { padding: 14px; border: 1px solid #bae6fd; border-radius: 8px; background: #f0f9ff; }
    .review-panel .field { margin-top: 14px; margin-bottom: 0; }
    input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; }
  </style>
</head>
<body>
<div class="topbar">
  <h1>问卷管理后台</h1>
  <span class="spacer"></span>
  <span id="topbarInfo" style="font-size:13px;opacity:.7"></span>
</div>

<div id="loginPanel">
  <h2>登录</h2>
  <div class="field"><label>管理员密码</label><input id="pwInput" type="password" autocomplete="current-password" /></div>
  <button class="btn btn-primary" id="loginBtn" style="width:100%">进入后台</button>
  <p class="error" id="loginError"></p>
</div>

<div id="mainPanel">
  <div class="toolbar">
    <button class="btn btn-primary" id="refreshBtn">刷新</button>
    <button class="btn btn-secondary" id="exportBtn">导出正常完成 Excel</button>
    <button class="btn btn-secondary" id="statsPageBtn">统计看板</button>
    <label class="filter-field">
      题目版本
      <select id="versionFilter">
        <option value="python">Python 版本</option>
        <option value="c">C 语言版本</option>
        <option value="agent">Agent 监督版本</option>
      </select>
    </label>
    <div class="version-controls" id="versionControls">
      <strong>前台开放</strong>
      <label><input type="checkbox" data-version-toggle="python" /> Python</label>
      <label><input type="checkbox" data-version-toggle="c" /> C</label>
      <label><input type="checkbox" data-version-toggle="agent" /> Agent</label>
      <span id="settingsMsg" style="color:#666"></span>
    </div>
    <button class="btn btn-danger" id="bulkDeleteSelectedBtn">删除选中</button>
    <button class="btn btn-danger" id="bulkDeleteFilteredBtn">删除当前筛选结果</button>
    <label class="filter-field">
      完成状态
      <select id="completionFilter">
        <option value="all">全部</option>
        <option value="normal_completed">正常完成</option>
        <option value="incomplete">未完成/异常</option>
      </select>
    </label>
    <label class="filter-field" id="incompleteReasonWrap">
      原因
      <select id="incompleteReasonFilter">
        <option value="all">全部原因</option>
        <option value="in_progress">进行中</option>
        <option value="pending_posttest">未提交后测</option>
        <option value="abandoned">已删除</option>
        <option value="quality_failed">质量异常</option>
        <option value="timeout">超时</option>
      </select>
    </label>
    <label style="font-size:13px;display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="showAbandoned" /> 显示已删除
    </label>
    <span class="stats" id="statsLabel"></span>
  </div>
  <table id="sessionTable">
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAllVisible" /></th><th>ID</th><th>班级</th><th>姓名</th><th>学号</th><th>分组</th><th>状态</th><th>总分</th><th>后测均分</th><th>质量</th><th>总耗时</th><th>创建时间</th><th>完成时间</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="sessionBody"></tbody>
  </table>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <button class="modal-close" id="modalClose">×</button>
    <h2 id="modalTitle">参与者详情</h2>
    <div id="modalContent"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
let pw = '';
let sessions = [];
let selectedSessionIds = new Set();
let questionnaireSettings = {python: true, c: true, agent: true};
const BASE_PATH = location.pathname
  .replace(/\/admin(?:\.html)?\/?$/, '')
  .replace(/\/$/, '');

function withBasePath(path) {
  return `${BASE_PATH}${path}`;
}

const ANSWER_KEY = {
  Q1:'B',Q2:'B',Q3:'B',Q4:'A',Q5:'B',Q6:'B',Q7:'B',Q8:'D',Q9:'A',Q10:'B',
  Q11:'A',Q12:'A',Q13:'A',Q14:'A',Q15:'D',Q16:'B',Q17:'B',Q18:'B',Q19:'A',Q20:'B',
  Q21:'A',Q22:'A',Q23:'A',Q24:'A',Q25:'D',Q26:'B',Q27:'B',Q28:'B',Q29:'A',Q30:'A'
};
const COMPLETION_REASON_LABELS = {in_progress:'进行中',pending_posttest:'未提交后测',abandoned:'已删除',quality_failed:'质量异常',timeout:'超时'};

function completionLabel(completion) {
  return completion?.completion_bucket === 'normal_completed'
    ? '正常完成'
    : (COMPLETION_REASON_LABELS[completion?.incomplete_reason] || '未完成');
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[char]);
}

async function api(path, opts = {}) {
  const sep = path.includes('?') ? '&' : '?';
  const version = document.getElementById('versionFilter')?.value || 'python';
  const res = await fetch(withBasePath(path) + sep + 'password=' + encodeURIComponent(pw) + '&version=' + encodeURIComponent(version), opts);
  const data = res.headers.get('content-type')?.includes('json') ? await res.json() : null;
  if (!res.ok) throw new Error(data?.detail || res.statusText);
  return data;
}

document.getElementById('loginBtn').onclick = async () => {
  pw = document.getElementById('pwInput').value;
  try {
    await api('/api/admin/sessions');
    sessionStorage.setItem('questionnaire_admin_password', pw);
    document.getElementById('loginPanel').style.display = 'none';
    document.getElementById('mainPanel').style.display = 'block';
    document.getElementById('topbarInfo').textContent = '已登录';
    await loadQuestionnaireSettings();
    loadSessions();
  } catch {
    document.getElementById('loginError').textContent = '密码错误';
  }
};
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });

async function loadSessions() {
  updateIncompleteReasonState();
  selectedSessionIds = new Set();
  const incl = shouldIncludeAbandoned();
  sessions = await api('/api/admin/sessions?include_abandoned=' + incl);
  renderTable();
}

async function loadQuestionnaireSettings() {
  const data = await api('/api/admin/questionnaire-settings');
  questionnaireSettings = {};
  for (const item of data.versions || []) {
    questionnaireSettings[item.version] = item.enabled;
  }
  document.querySelectorAll('[data-version-toggle]').forEach(input => {
    input.checked = Boolean(questionnaireSettings[input.dataset.versionToggle]);
  });
}

async function saveQuestionnaireSettings() {
  const enabled_versions = {};
  document.querySelectorAll('[data-version-toggle]').forEach(input => {
    enabled_versions[input.dataset.versionToggle] = input.checked;
  });
  const msg = document.getElementById('settingsMsg');
  msg.textContent = '保存中...';
  const data = await api('/api/admin/questionnaire-settings', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled_versions }),
  });
  questionnaireSettings = {};
  for (const item of data.versions || []) {
    questionnaireSettings[item.version] = item.enabled;
  }
  msg.textContent = '已保存';
  setTimeout(() => { msg.textContent = ''; }, 1200);
}

function shouldIncludeAbandoned() {
  const completion = document.getElementById('completionFilter').value;
  const reason = document.getElementById('incompleteReasonFilter').value;
  return document.getElementById('showAbandoned').checked || completion === 'incomplete' || reason === 'abandoned';
}

function updateIncompleteReasonState() {
  const completion = document.getElementById('completionFilter').value;
  const reason = document.getElementById('incompleteReasonFilter');
  const enabled = completion === 'incomplete';
  reason.disabled = !enabled;
  document.getElementById('incompleteReasonWrap').style.opacity = enabled ? '1' : '.55';
  if (!enabled) reason.value = 'all';
}

function filteredSessions() {
  const completion = document.getElementById('completionFilter').value;
  const reason = document.getElementById('incompleteReasonFilter').value;
  return sessions.filter(s => {
    if (completion !== 'all' && s.completion_bucket !== completion) return false;
    if (completion === 'incomplete' && reason !== 'all' && s.incomplete_reason !== reason) return false;
    return true;
  });
}

function renderTable() {
  const tbody = document.getElementById('sessionBody');
  tbody.innerHTML = '';
  const visibleSessions = filteredSessions();
  const total = visibleSessions.length;
  const normal = visibleSessions.filter(s => s.sample_included).length;
  const incomplete = visibleSessions.filter(s => s.completion_bucket === 'incomplete').length;
  const testCount = visibleSessions.filter(s => s.is_test).length;
  document.getElementById('statsLabel').textContent = `显示 ${total} 条 · 正式正常完成 ${normal} · 未完成/异常 ${incomplete} · 测试 ${testCount} · 已选 ${selectedSessionIds.size}`;
  for (const s of visibleSessions) {
    const tr = document.createElement('tr');
    const statusBadge = {complete:'badge-complete',in_progress:'badge-progress',abandoned:'badge-abandoned',timeout:'badge-timeout'}[s.status] || '';
    const groupBadge = s.group === 'A' ? 'badge-a' : 'badge-b';
    const qualityBadge = s.valid
      ? (s.completion_source === 'manual' ? '<span class="badge badge-manual">人工通过</span>' : '')
      : s.is_test
      ? '<span class="badge badge-test">测试不计入</span>'
      : '<span class="badge badge-invalid">无效</span>';
    const manualBadge = s.completion_source === 'manual' ? '<span class="badge badge-manual">人工复核</span> ' : '';
    const testBadge = s.is_test ? '<span class="badge badge-test">测试</span> ' : '';
    const participantLabel = s.is_test ? '测试' : `#${s.participant_id}`;
    tr.innerHTML = `
      <td><input type="checkbox" class="row-select" data-session-id="${s.session_id}" ${selectedSessionIds.has(s.session_id) ? 'checked' : ''} /></td>
      <td><strong>${participantLabel}</strong><br><span style="font-size:11px;color:#999">${s.session_id.slice(0,8)}…</span></td>
      <td>${escapeHtml(s.class_name || '-')}</td>
      <td>${escapeHtml(s.student_name || '-')}</td>
      <td>${escapeHtml(s.student_id || '-')}</td>
      <td><span class="badge ${groupBadge}">${s.group}</span></td>
      <td>${testBadge}${manualBadge}<span class="badge ${statusBadge}">${completionLabel(s)}</span></td>
      <td>${s.total_score ?? '-'} / 30</td>
      <td>${s.post_agent_supervision_score ?? '-'}</td>
      <td>${qualityBadge}${s.quality_flags.length ? `<div class="flag-list">${s.quality_flags.join('<br>')}</div>` : '✓'}</td>
      <td style="font-size:12px">${s.total_duration_hms || '-'}</td>
      <td style="font-size:12px">${s.created_at ? s.created_at.slice(0,16).replace('T',' ') : '-'}</td>
      <td style="font-size:12px">${s.completed_at ? s.completed_at.slice(0,16).replace('T',' ') : '-'}</td>
      <td>
        <button class="btn btn-secondary btn-sm" onclick="openDetail('${s.session_id}')">详情</button>
        ${s.status !== 'abandoned'
          ? `<button class="btn btn-danger btn-sm" style="margin-left:4px" onclick="deleteSession('${s.session_id}')">删除</button>`
          : `<button class="btn btn-secondary btn-sm" style="margin-left:4px" onclick="restoreSession('${s.session_id}')">恢复</button>`}
      </td>`;
    tbody.appendChild(tr);
  }
  tbody.querySelectorAll('.row-select').forEach(input => {
    input.onchange = () => {
      if (input.checked) selectedSessionIds.add(input.dataset.sessionId);
      else selectedSessionIds.delete(input.dataset.sessionId);
      updateSelectionState();
    };
  });
  updateSelectionState();
}

function visibleSessionIds() {
  return filteredSessions().map(s => s.session_id);
}

function updateSelectionState() {
  const visibleIds = visibleSessionIds();
  const selectedVisible = visibleIds.filter(id => selectedSessionIds.has(id));
  const selectAll = document.getElementById('selectAllVisible');
  if (selectAll) {
    selectAll.checked = visibleIds.length > 0 && selectedVisible.length === visibleIds.length;
    selectAll.indeterminate = selectedVisible.length > 0 && selectedVisible.length < visibleIds.length;
  }
  document.getElementById('statsLabel').textContent = document.getElementById('statsLabel').textContent.replace(/已选 \d+$/, `已选 ${selectedSessionIds.size}`);
}

async function deleteSession(id) {
  if (!confirm('确认删除该参与者数据？')) return;
  await api('/api/admin/sessions/' + id, { method: 'DELETE' });
  loadSessions();
}

async function restoreSession(id) {
  await api('/api/admin/sessions/' + id + '/restore', { method: 'POST' });
  loadSessions();
}

async function bulkDelete(sessionIds, label) {
  const ids = [...new Set(sessionIds)].filter(Boolean);
  if (!ids.length) { alert('没有可删除的数据'); return; }
  if (!confirm(`确认删除${label}的 ${ids.length} 条数据？`)) return;
  const result = await api('/api/admin/sessions/bulk-delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_ids: ids }),
  });
  alert(`已删除 ${result.deleted} 条数据`);
  loadSessions();
}

async function openDetail(id) {
  const data = await api('/api/admin/sessions/' + id);
  const s = data.session;
  const modal = document.getElementById('detailModal');
  document.getElementById('modalTitle').textContent = s.is_test ? '测试问卷详情' : `参与者 #${s.participant_id}`;

  const kv = (k, v) => `<div class="kv"><div class="k">${k}</div><div class="v">${v ?? '-'}</div></div>`;

  const pretest = data.pretest || {};
  const posttest = data.posttest || {};
  const answers = data.answers || {};
  const scores = data.scores || {};
  const posttestScores = data.posttest_scores || {};
  const automaticCompletion = data.automatic_completion || {};
  const completion = data.completion || {};
  const qualityFlags = data.quality_flags || [];
  const override = s.completion_override || 'auto';

  const answersHtml = Object.entries(ANSWER_KEY).map(([qid, correct]) => {
    const given = answers[qid];
    const cls = !given ? '' : given === correct ? 'correct' : 'wrong';
    return `<div class="answer-cell ${cls}"><div class="qid">${qid}</div>${given || '-'}</div>`;
  }).join('');

  document.getElementById('modalContent').innerHTML = `
    <div class="section-title">基本信息</div>
    <div class="kv-grid">
      ${kv('会话 ID', s.id)}
      ${kv('类型', s.is_test ? '测试问卷（不计入正式样本）' : '正式样本')}
      ${kv('班级', pretest.class_name ? escapeHtml(pretest.class_name) : '-')}
      ${kv('姓名', pretest.student_name ? escapeHtml(pretest.student_name) : '-')}
      ${kv('学号', pretest.student_id ? escapeHtml(pretest.student_id) : '-')}
      ${kv('分组', s.group_name)}
      ${kv('状态', s.completed_at ? '完成' : s.abandoned_at ? '已删除' : '进行中')}
      ${kv('当前任务', s.current_task)}
      ${kv('总耗时', s.total_duration_hms)}
      ${kv('创建时间', s.created_at?.slice(0,19).replace('T',' '))}
      ${kv('完成时间', s.completed_at?.slice(0,19).replace('T',' '))}
    </div>

    <div class="section-title">前测信息</div>
    <div class="kv-grid">
      ${Object.entries(pretest).filter(([k]) => !['consent', 'class_name', 'student_name', 'student_id'].includes(k)).map(([k,v]) => kv(k, v)).join('')}
    </div>

    <div class="section-title">得分</div>
    <div class="kv-grid">
      ${kv('总分', `${scores.total_score ?? '-'} / 30`)}
      ${kv('可交付性', scores.deliverability_score)}
      ${kv('推理', scores.reasoning_score)}
      ${kv('错误识别', scores.error_identification_score)}
      ${kv('后测 AI supervision mindset 均分', posttestScores.post_agent_supervision_score)}
    </div>

    <div class="section-title">完成状态复核</div>
    <div class="review-panel">
      <div class="kv-grid">
        ${kv('自动判定', completionLabel(automaticCompletion))}
        ${kv('当前采用状态', `${completionLabel(completion)}${completion.completion_source === 'manual' ? '（人工复核）' : '（自动判定）'}`)}
        ${kv('自动质量标记', qualityFlags.length ? qualityFlags.join('<br>') : '无')}
        ${kv('人工修改时间', s.completion_override_updated_at?.slice(0,19).replace('T',' '))}
      </div>
      <div class="field">
        <label for="editCompletionOverride">人工完成状态</label>
        <select id="editCompletionOverride" ${s.abandoned_at ? 'disabled' : ''}>
          <option value="auto" ${override==='auto'?'selected':''}>按自动判定</option>
          <option value="normal_completed" ${override==='normal_completed'?'selected':''}>正常完成</option>
          <option value="quality_failed" ${override==='quality_failed'?'selected':''}>质量异常</option>
          <option value="timeout" ${override==='timeout'?'selected':''}>超时</option>
          <option value="pending_posttest" ${override==='pending_posttest'?'selected':''}>未提交后测</option>
          <option value="in_progress" ${override==='in_progress'?'selected':''}>进行中</option>
        </select>
      </div>
      <div class="field">
        <label for="editCompletionOverrideNote">复核备注</label>
        <textarea id="editCompletionOverrideNote" placeholder="可填写人工判断依据" ${s.abandoned_at ? 'disabled' : ''}>${escapeHtml(s.completion_override_note)}</textarea>
      </div>
      <div class="edit-row">
        <button class="btn btn-primary btn-sm" onclick="saveCompletionOverride('${s.id}')" ${s.abandoned_at ? 'disabled' : ''}>保存完成状态</button>
        <span id="completionOverrideMsg" style="font-size:13px;color:#065f46">${s.abandoned_at ? '已删除数据请先恢复' : ''}</span>
      </div>
    </div>

    <div class="section-title">答题详情（绿=正确 红=错误）</div>
    <div class="answers-grid">${answersHtml}</div>

    ${Object.keys(posttest).length ? `
    <div class="section-title">后测</div>
    <div class="kv-grid">${Object.entries(posttest).map(([k,v]) => kv(k,v)).join('')}</div>` : ''}

    <div class="section-title">修改分组</div>
    <div class="edit-row">
      <select id="editGroup">
        <option value="A" ${s.group_name==='A'?'selected':''}>A 组</option>
        <option value="B" ${s.group_name==='B'?'selected':''}>B 组</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="saveGroup('${s.id}')">保存</button>
      <span id="editMsg" style="font-size:13px;color:#065f46"></span>
    </div>
  `;

  document.getElementById('modalActions').innerHTML = `
    <button class="btn btn-danger" onclick="deleteSession('${s.id}');closeModal()">删除此参与者</button>
    <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
  `;

  modal.classList.add('open');
}

async function saveGroup(id) {
  const group = document.getElementById('editGroup').value;
  await api('/api/admin/sessions/' + id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ group_name: group }),
  });
  document.getElementById('editMsg').textContent = '已保存';
  loadSessions();
}

async function saveCompletionOverride(id) {
  const completion_override = document.getElementById('editCompletionOverride').value;
  const completion_override_note = document.getElementById('editCompletionOverrideNote').value;
  await api('/api/admin/sessions/' + id, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ completion_override, completion_override_note }),
  });
  await loadSessions();
  await openDetail(id);
  document.getElementById('completionOverrideMsg').textContent = '已保存';
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('open');
}

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('detailModal').onclick = e => { if (e.target === e.currentTarget) closeModal(); };

document.getElementById('refreshBtn').onclick = loadSessions;
document.getElementById('versionFilter').onchange = loadSessions;
document.querySelectorAll('[data-version-toggle]').forEach(input => {
  input.onchange = saveQuestionnaireSettings;
});
document.getElementById('showAbandoned').onchange = loadSessions;
document.getElementById('completionFilter').onchange = loadSessions;
document.getElementById('incompleteReasonFilter').onchange = loadSessions;
document.getElementById('selectAllVisible').onchange = e => {
  for (const id of visibleSessionIds()) {
    if (e.target.checked) selectedSessionIds.add(id);
    else selectedSessionIds.delete(id);
  }
  renderTable();
};
document.getElementById('bulkDeleteSelectedBtn').onclick = () => bulkDelete([...selectedSessionIds], '选中');
document.getElementById('bulkDeleteFilteredBtn').onclick = () => bulkDelete(visibleSessionIds(), '当前筛选结果');
document.getElementById('statsPageBtn').onclick = () => {
  sessionStorage.setItem('questionnaire_admin_password', pw);
  window.open(withBasePath('/stats.html'), '_blank');
};

document.getElementById('exportBtn').onclick = async () => {
  const version = document.getElementById('versionFilter').value;
  const res = await fetch(withBasePath('/api/admin/export') + '?password=' + encodeURIComponent(pw) + '&version=' + encodeURIComponent(version));
  if (!res.ok) { alert('导出失败'); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `questionnaire_${version}_normal_completed_export.xlsx`; a.click();
  URL.revokeObjectURL(url);
};
</script>
</body>
</html>
